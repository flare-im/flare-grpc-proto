[package]
name = "flare-grpc-proto"
version = "1.0.3"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM gRPC 服务 proto 生成（tonic client/server + 消息），依赖 flare-proto 基础类型"
repository = "https://github.com/flare-im/flare-grpc-proto"
homepage = "https://github.com/flare-im/flare-grpc-proto"
documentation = "https://docs.rs/flare-grpc-proto"

[dependencies]
flare-proto = "1.0.3"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
serde = { version = "1", features = ["derive"] }

[features]
default = []
# 独立 SFU 控制面 proto（`sfu_control.proto`）。核心默认不启用；仅 SFU 插件/进程显式打开。
sfu_control = []

[build-dependencies]
flare-proto = "1.0.3"
tonic-prost-build = "0.14"
